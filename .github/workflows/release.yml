name: release

on:
  push:
    # This repo's first release was tagged `1.0.0`, without the `v` that
    # goreleaser projects normally use. Accept both, so a tag can never push
    # silently and build nothing.
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser needs the full history to build the changelog.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # goreleaser's Rust builder shells out to cargo-zigbuild and will not
      # install it. The pip package pulls in the Zig toolchain with it, which
      # is what makes cross-compiling every target from one Linux runner work.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cargo-zigbuild

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Creates the GitHub release on this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the cask to epenthesis/homebrew-tap. Cross-repository
          # writes need their own token; the built-in one cannot do it.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
